name: Build Phantom Decor (Fabric 1.21.11)
on:
  push:
    branches: [main, feature/phantomdecor, revamp/native-blocks-resourcepack]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile Fabric mod
        run: gradle --no-daemon clean build --stacktrace
      - name: Create resource pack
        run: python3 tools/build_resourcepack.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhantomDecor-Fabric-1.21.11-JAR
          path: |
            build/libs/phantomdecor-fabric-1.21.11-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PhantomDecor-ResourcePack-1.21.11
          path: build/PhantomDecor-ResourcePack-1.21.11.zip
          if-no-files-found: error
