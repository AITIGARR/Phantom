name: Build Phantom Decor
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and verify
        run: ./gradlew clean build
      - name: Package resource pack
        run: cd resourcepack && zip -qr ../PhantomDecor-ResourcePack.zip .
      - name: Name deliverables
        run: cp build/libs/phantomdecor-fabric-1.21.11-1.0.0.jar PhantomDecor-1.21.11.jar
      - uses: actions/upload-artifact@v4
        with:
          name: PhantomDecor-1.21.11
          path: |
            PhantomDecor-1.21.11.jar
            PhantomDecor-ResourcePack.zip
