name: Build Phantom Decor (Fabric 1.21.11)

on:
  push:
    branches: [main, feature/phantomdecor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack initial source archive
        run: |
          if [ -f phantomdecor-source.tar.xz ]; then
            tar -xJf phantomdecor-source.tar.xz
            python3 make_recipes.py
          fi

      - name: Publish unpacked source files to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/phantomdecor'
        run: |
          if [ -f phantomdecor-source.tar.xz ]; then
            rm phantomdecor-source.tar.xz
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m "chore: unpack Fabric source and recipes" || true
            git push origin HEAD:feature/phantomdecor
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build JAR
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhantomDecor-Fabric-1.21.11-JAR
          path: build/libs/phantomdecor-fabric-1.21.11-1.0.0.jar
          if-no-files-found: error
